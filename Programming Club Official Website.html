*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px;border-radius:6px}
.sr{position:absolute;left:-999px}.sr:focus{left:8px;top:8px;background:#fff;color:#000;padding:8px;z-index:99}
#bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 80% 0,#1a1450 0,transparent 70%),radial-gradient(50% 40% at 0 100%,#0a2a4a 0,transparent 70%),var(--bg)}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));z-index:100}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;transition:background .3s,padding .3s}
nav.sc{background:rgba(7,9,20,.78);backdrop-filter:blur(14px);padding:6px 5vw;border-bottom:1px solid var(--bd)}
nav .logo{--s:56px;transition:--s .3s}nav.sc .logo{--s:40px}
.links{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.links a{display:block;padding:8px 9px;border-radius:10px;text-decoration:none;font-size:.85rem;color:var(--mut);position:relative;transition:color .2s,background .2s}
.links a:hover,.links a.on{color:#fff;background:var(--glass)}
.links a::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:linear-gradient(90deg,var(--c1),var(--c3));transform:scaleX(0);transition:transform .25s}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.links a.cta{background:linear-gradient(90deg,var(--c1),var(--c2));color:#04121c;font-weight:700}
#burger{display:none;width:46px;height:46px;background:var(--glass);border:1px solid var(--bd);border-radius:12px;cursor:pointer;position:relative}
#burger i{position:absolute;left:12px;right:12px;height:2px;background:#fff;border-radius:2px;transition:transform .3s,opacity .2s}
#burger i:nth-child(1){top:16px}#burger i:nth-child(2){top:22px}#burger i:nth-child(3){top:28px}
#burger[aria-expanded=true] i:nth-child(1){transform:translateY(6px) rotate(45deg)}
#burger[aria-expanded=true] i:nth-child(2){opacity:0}
#burger[aria-expanded=true] i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.mlogo{display:none}
@media(max-width:1240px){
#burger{display:block}
.links{position:fixed;inset:0;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:rgba(7,9,20,.96);backdrop-filter:blur(16px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.links.open{opacity:1;visibility:visible}
.links a{font-size:1.2rem;padding:10px 22px}
.mlogo{display:block;margin-bottom:14px}
#burger{z-index:2}}
/* LOGO */
.logo{--s:64px;position:relative;width:var(--s);height:var(--s);display:inline-grid;place-items:center;cursor:pointer;border:0;background:none;padding:0;transition:transform .3s,filter .3s;animation:lin .9s cubic-bezier(.2,.8,.2,1) both}
.logo .glow{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.55),rgba(124,92,255,.35) 45%,transparent 70%);opacity:.6;animation:pulse 4.5s ease-in-out infinite;z-index:0;will-change:opacity,transform}
.logo img,.logo svg{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,229,255,.6));animation:bright 4.5s ease-in-out infinite}
.logo .sweep{position:absolute;inset:0;z-index:2;overflow:hidden;border-radius:18%;pointer-events:none}
.logo .sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-15deg);animation:sweep 7s ease-in-out 1.5s infinite}
.logo:hover{transform:scale(1.07);filter:brightness(1.25)}
.logo:hover .glow{opacity:1}
.logo:hover .sweep::before{animation:sweep 1s ease-out 1}
.logo.big{--s:min(260px,56vw)}
.logo .ring{position:absolute;inset:-14%;border-radius:50%;border:2px solid transparent;border-top-color:var(--c1);border-right-color:rgba(124,92,255,.7);animation:spin 9s linear infinite;z-index:0;opacity:.85}
.logo.static,.logo.static *{animation:none!important}
@keyframes lin{from{opacity:0;transform:scale(.7);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes pulse{50%{opacity:1;transform:scale(1.12)}}
@keyframes bright{50%{filter:drop-shadow(0 0 14px rgba(0,229,255,.9)) brightness(1.1)}}
@keyframes sweep{0%{left:-50%}35%,100%{left:130%}}
@keyframes spin{to{transform:rotate(360deg)}}
main{display:block}
.view{display:none}.view.on{display:block;animation:vin .5s ease both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
section{padding:96px 5vw;max-width:1200px;margin:auto}
.eyebrow{color:var(--c1);letter-spacing:.2em;font-size:.8rem;font-weight:700;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(1.9rem,4.5vw,3.2rem);margin-bottom:14px}
.lead{color:var(--mut);max-width:720px;margin:0 0 36px;font-size:1.08rem}
.grad{background:linear-gradient(90deg,var(--c1),var(--c2) 55%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding-top:120px;position:relative}
.hero h1{font-size:clamp(2.6rem,9vw,6.4rem);letter-spacing:.02em;margin:26px 0 10px}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(30px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.sub{font-size:clamp(1.1rem,2.6vw,1.7rem);font-weight:600;opacity:0;animation:up .7s .55s forwards}
.hero p{color:var(--mut);max-width:620px;margin:14px auto 30px;opacity:0;animation:up .7s .7s forwards}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;opacity:0;animation:up .7s .85s forwards}
@keyframes up{to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:14px;border:1px solid var(--bd);font:700 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;color:#fff;background:var(--glass);transition:transform .2s,box-shadow .25s,background .25s}
.btn.pri{background:linear-gradient(90deg,var(--c1),var(--c2));color:#03101a;border:0;box-shadow:0 0 24px rgba(0,229,255,.3)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(124,92,255,.4)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.code{position:absolute;font:.8rem ui-monospace,Consolas,monospace;color:rgba(0,229,255,.35);white-space:pre;pointer-events:none;animation:flt 12s ease-in-out infinite;display:none}
@media(min-width:900px){.code{display:block}}
@keyframes flt{50%{transform:translateY(-14px)}}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:26px;backdrop-filter:blur(10px);transition:transform .3s,border-color .3s,box-shadow .3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);border-color:rgba(0,229,255,.55);box-shadow:0 14px 40px rgba(0,229,255,.14)}
.card .ic{font-size:2rem;display:inline-block;transition:transform .3s}.card:hover .ic{transform:scale(1.18) rotate(-6deg)}
.card h3{font-size:1.25rem;margin:10px 0 6px}.card p{margin:0;color:var(--mut)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.hack{text-align:center;border:1px solid var(--bd);border-radius:28px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(124,92,255,.14),rgba(255,61,242,.1));padding:clamp(28px,6vw,64px);position:relative;overflow:hidden}
.hack h2{font-size:clamp(2rem,6vw,4.2rem)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);font-size:.9rem}
.cd{display:inline-flex;gap:10px;margin:18px 0;font:800 clamp(1.4rem,4.5vw,2.6rem) ui-monospace,Consolas,monospace;letter-spacing:.12em}
.cd span{padding:14px 20px;border-radius:14px;border:1px solid rgba(0,229,255,.5);background:rgba(0,0,0,.35);box-shadow:0 0 22px rgba(0,229,255,.25);animation:pulse2 3s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 34px rgba(124,92,255,.55)}}
.facts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:16px}
.facts div{padding:16px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--bd)}
.facts small{display:block;color:var(--mut);letter-spacing:.14em;font-size:.72rem}.facts b{color:var(--c1)}
.person{text-align:center}
.av{width:104px;height:104px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font:800 2rem "Segoe UI",sans-serif;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));box-shadow:0 0 30px rgba(124,92,255,.5);transition:transform .3s}
.person:hover .av{transform:scale(1.08)}
.role{color:var(--c1);font-weight:600}
.soon{border-style:dashed;text-align:center;padding:38px}
.lvl{border-top:3px solid var(--c1)}.lvl:nth-child(2){border-color:var(--c2)}.lvl:nth-child(3){border-color:var(--c3)}
.pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}
.pick button{padding:20px;font-size:1.05rem;border-radius:16px;border:1px solid var(--bd);background:var(--glass);color:#fff;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.pick button:hover{transform:translateY(-4px);border-color:var(--c1)}
.pick button[aria-pressed=true]{border-color:var(--c1);background:rgba(0,229,255,.14)}
#resp{min-height:80px;margin-top:20px;font-size:1.2rem}
#resp .msg{animation:up .5s both;opacity:0}
form{display:grid;gap:16px;background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:clamp(20px,4vw,36px);max-width:760px;margin:24px auto 0;text-align:left}
label{font-weight:600;font-size:.95rem;display:block;margin-bottom:6px}
label small{color:var(--mut);font-weight:400}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.4);color:#fff;font:inherit;transition:border-color .2s,box-shadow .2s}
select option{background:#0d1122}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,229,255,.25);outline:0}
textarea{min-height:96px;resize:vertical}
.err{color:#ff8fa3;font-size:.85rem;min-height:0;margin-top:4px}
[aria-invalid=true]{border-color:#ff5d7a}
fieldset{border:0;margin:0;padding:0;display:grid;gap:16px;min-width:0}
.banner{padding:14px 18px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,200,0,.1);text-align:center}
.banner.open{background:rgba(0,255,150,.1)}
.ok{text-align:center;padding:36px;border-radius:22px;border:1px solid rgba(0,255,170,.5);background:rgba(0,255,170,.08);font-size:1.15rem;max-width:760px;margin:24px auto 0;animation:up .5s both;opacity:0}
.ok small{display:block;margin-top:12px;color:var(--mut);font-size:.8rem}
.back{display:inline-block;margin-bottom:12px;color:var(--c1)}
footer{border-top:1px solid var(--bd);padding:40px 5vw;text-align:center;color:var(--mut);background:rgba(0,0,0,.25)}
footer .logo{margin-bottom:10px}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
.rv,.hero h1 span,.sub,.hero p,.btns,.ok,#resp .msg{opacity:1!important;transform:none!important}}
#cd,#cg,.rip{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%}
#cd,#cg{opacity:0;transition:opacity .3s,width .25s,height .25s,margin .25s,border-color .25s}
#cd{width:8px;height:8px;margin:-4px;background:var(--c1);box-shadow:0 0 12px var(--c1)}
#cg{width:38px;height:38px;margin:-19px;border:1px solid rgba(0,229,255,.4);background:radial-gradient(circle,rgba(124,92,255,.18),transparent 70%)}
body.cur-on #cd,body.cur-on #cg{opacity:1}body.cur-h #cg{width:64px;height:64px;margin:-32px;border-color:var(--c3)}
.rip{width:10px;height:10px;margin:-5px;border:2px solid var(--c1);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(6);opacity:0}}
@media(hover:none),(pointer:coarse){#cd,#cg{display:none}}
.rad{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}.rad input{width:auto}
input[type=file]{padding:10px}legend{padding:0}
.thumbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));margin-top:10px}
.thumbs figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-size:1.1rem}
.thumbs em{position:absolute;left:4px;bottom:4px;font:700 .65rem inherit;background:var(--c1);color:#000;padding:1px 7px;border-radius:99px}
.rules{text-align:left;max-width:560px;margin:14px auto;color:var(--mut)}
</style>
</head>

<nav id="nav" aria-label="Main">
  <span id="navlogo"></span>
  <button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="links"><i></i><i></i><i></i></button>

</nav>
<main id="main">
  <div class="view on" id="v-home"></div>

</main>

/* =============== helpers =============== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

function logo(cls=""){
  const mark = CONFIG.logo ? `<img src="${esc(CONFIG.logo)}" alt="">` :
   `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg${cls.length}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="22" fill="#0b1230" stroke="url(#lg${cls.length})" stroke-width="4"/><text x="50" y="62" text-anchor="middle" font-family="monospace" font-weight="700" font-size="38" fill="url(#lg${cls.length})">&lt;/&gt;</text></svg>`;
  return `<button class="logo ${cls}" data-go="#home" aria-label="${CONFIG.club} — back to home"><span class="glow"></span>${cls.includes("big")?'<span class="ring"></span>':""}${mark}<span class="sweep"></span></button>`;
}

async function post(type,data){
  if(!CONFIG.scriptUrl) throw new Error("This form isn't connected to the club's database yet, so nothing was sent.");
  let res,txt; try{ res=await fetch(CONFIG.scriptUrl,{method:"POST",body:JSON.stringify({type,data})}); txt=await res.text(); }
  catch{ throw new Error("Could not reach the backend. Check your internet connection and that the Apps Script is deployed with access set to \"Anyone\"."); }
  let j; try{ j=JSON.parse(txt); }catch{ throw new Error("The backend did not return valid JSON (HTTP "+res.status+"). Redeploy the Apps Script as a Web App: Execute as Me, access Anyone, new version."); }
  if(!j||j.ok!==true) throw new Error((j&&(j.message||j.error))||"The backend rejected the submission."); return j;
}
/* =============== render =============== */
function form(id, fields, btn){
  return `<form id="${id}" novalidate>${fields.map(f=>{
    const req=f.req?"":' <small>(optional)</small>';
    let inp = f.type==="select" ? `<select id="${id}-${f.k}" name="${f.k}"><option value="">Select…</option>${f.opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`
      : f.type==="textarea" ? `<textarea id="${id}-${f.k}" name="${f.k}" maxlength="1000"></textarea>`
      : `<input id="${id}-${f.k}" name="${f.k}" type="${f.t||"text"}" maxlength="100" autocomplete="${f.ac||"off"}"${f.t==="tel"?' inputmode="tel"':""}>`;
    return `<div><label for="${id}-${f.k}">${f.l}${req}</label>${inp}<div class="err" id="${id}-${f.k}-e" role="alert"></div></div>`}).join("")}
    <div class="err" id="${id}-status" role="alert"></div><button class="btn pri" type="submit">${btn}</button></form>`;
}

    <div class="grid" style="margin-top:28px">${C.team.map(m=>`<article class="card person rv">${safeUrl(m.photo)?`<img class="av" style="object-fit:cover" src="${esc(m.photo)}" alt="${esc(m.name)}">`:`<div class="av" aria-hidden="true">${m.name.split(" ").map(w=>w[0]).join("")}</div>`}<h3>${esc(m.name)}</h3><div class="role">${esc(m.role)}</div>${m.desc?`<p>${esc(m.desc)}</p>`:""}${safeUrl(m.link)?`<p><a href="${esc(m.link)}" target="_blank" rel="noopener">Profile ↗</a></p>`:""}</article>`).join("")}

/* =============== forms =============== */
function bind(){
  const bindForm=(id,fields,msg)=>{
    const f=$("#"+id); if(!f) return;
    f.addEventListener("submit",async e=>{
      e.preventDefault(); let bad=null;
      fields.forEach(x=>{
        const el=$(`#${id}-${x.k}`), v=el.value.trim(), er=$(`#${id}-${x.k}-e`); let m="";
        if(x.req&&!v) m="This field is required."; else if(v&&x.min&&v.length<x.min) m=`Please write at least ${x.min} characters.`;
        else if(v&&x.t==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) m="Please enter a valid email address.";
        else if(v&&x.t==="tel"&&!(/^\+?[\d\s()\-]{7,20}$/.test(v)&&v.replace(/\D/g,"").length>=7&&v.replace(/\D/g,"").length<=15)) m="Please enter a valid phone number.";
        er.textContent=m; el.setAttribute("aria-invalid",!!m); if(m&&!bad) bad=el; });
      if(bad){bad.focus();return;}
      const btn=$("button[type=submit]",f), old=btn.textContent, sm=$("#"+id+"-status"); btn.disabled=true; btn.textContent="Submitting…"; sm.textContent="";
      try{ const j=await post(id==="joinf"?"member":"exec",Object.fromEntries(new FormData(f)));
        const box=document.createElement("div"); box.className="ok"; box.setAttribute("role","status");
        box.innerHTML=esc(msg)+`<br><br><b>${esc(j.id)}</b>`;
        f.replaceWith(box); box.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"}); box.tabIndex=-1; box.focus({preventScroll:true});
      }catch(err){ btn.disabled=false; btn.textContent=old; sm.textContent=err.message; }
    });
  };
  bindForm("joinf",JOIN_FIELDS,CONFIG.joinSuccess);
  if(CONFIG.executiveApplications==="OPEN") bindForm("execf",EXEC_FIELDS(),CONFIG.success);
  $("#joinbtn").onclick=()=>{const w=$("#joinwrap");w.hidden=false;$("#joinbtn").setAttribute("aria-expanded","true");$("input",w).focus();};
  $$(".pick button").forEach(b=>b.onclick=()=>{
    $$(".pick button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#resp").innerHTML=`<div class="msg">${esc(CONFIG.build[b.textContent])}<br><br><a class="btn pri" href="#join">Join Us →</a></div>`; });
}

/* =============== routing / nav =============== */
function show(v){ ["home","apply"].forEach(x=>$("#v-"+x).classList.toggle("on",x===v)); }
function go(h){
  const r={"#/apply":"apply"}[h]||"home"; $("#links").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); document.body.style.overflow="";
  if(r!=="home"){ show(r); scrollTo({top:0}); history.replaceState(null,"",h); }
  else { show("home"); const t=$(h)||$("#home"); requestAnimationFrame(()=>t.scrollIntoView({behavior:RM?"auto":"smooth"})); history.replaceState(null,"",h); }
  $$(".links a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")===h)); observe();
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href^='#']"), b=e.target.closest("[data-go]");
  if(a){ e.preventDefault(); go(a.getAttribute("href")); } else if(b){ go(b.dataset.go); } });
$("#burger").onclick=function(){ const o=$("#links").classList.toggle("open"); this.setAttribute("aria-expanded",o); document.body.style.overflow=o?"hidden":""; };
addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#links").classList.contains("open")){ $("#burger").click(); $("#burger").focus(); } });
const nav=$("#nav"), prog=$("#prog");
addEventListener("scroll",()=>{ const y=scrollY, h=document.documentElement.scrollHeight-innerHeight;
  nav.classList.toggle("sc",y>40); prog.style.transform=`scaleX(${h>0?y/h:0})`; },{passive:true});

/* scroll reveal */
let io; function observe(){ io&&io.disconnect(); io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);} }),{threshold:.12});
  $$(".rv:not(.in)").forEach((el,i)=>{ el.style.transitionDelay=(i%4)*70+"ms"; io.observe(el); }); }

/* particles: light canvas, paused when hidden, static when reduced motion */
(function(){ const cv=$("#cv"), cx=cv.getContext("2d"); let w,h,P=[],raf;
  const size=()=>{ w=cv.width=innerWidth; h=cv.height=innerHeight; const n=Math.min(48,Math.floor(w*h/32000)); P=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})); };
  const draw=()=>{ cx.clearRect(0,0,w,h);
    for(const p of P){ if(!RM){p.x+=p.vx;p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1;}
      cx.fillStyle="rgba(0,229,255,.7)"; cx.fillRect(p.x,p.y,2,2); }
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){ const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
      if(d<19000){ cx.strokeStyle=`rgba(124,92,255,${.28*(1-d/19000)})`; cx.beginPath(); cx.moveTo(P[i].x,P[i].y); cx.lineTo(P[j].x,P[j].y); cx.stroke(); } }
    if(!RM) raf=requestAnimationFrame(draw); };
  size(); draw(); addEventListener("resize",()=>{cancelAnimationFrame(raf);size();draw();});
  document.addEventListener("visibilitychange",()=>{ cancelAnimationFrame(raf); if(!document.hidden&&!RM) draw(); }); })();

/* cursor: desktop mouse only, off for reduced motion */
(function(){ if(RM||!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  const d=$("#cd"), g=$("#cg"); let x=0,y=0,gx=0,gy=0,on=false, mag=null;
  const loop=()=>{ gx+=(x-gx)*.16; gy+=(y-gy)*.16; g.style.transform=`translate(${gx}px,${gy}px)`; requestAnimationFrame(loop); };
  addEventListener("mousemove",e=>{ x=e.clientX; y=e.clientY; d.style.transform=`translate(${x}px,${y}px)`; if(!on){on=true;gx=x;gy=y;document.body.classList.add("cur-on");loop();}
    document.body.classList.toggle("cur-h",!!e.target.closest(".btn,.card,a,button,select,label"));
    const m=e.target.closest(".btn.pri,.links a.cta"); if(mag&&mag!==m){mag.style.translate="";mag=null;}
    if(m){ const r=m.getBoundingClientRect(); m.style.translate=`${(x-r.left-r.width/2)*.18}px ${(y-r.top-r.height/2)*.18}px`; mag=m; } },{passive:true});
  document.addEventListener("mouseleave",()=>document.body.classList.remove("cur-on")); document.addEventListener("mouseenter",()=>on&&document.body.classList.add("cur-on"));
  addEventListener("click",e=>{ const r=document.createElement("span"); r.className="rip"; r.style.left=e.clientX+"px"; r.style.top=e.clientY+"px"; document.body.appendChild(r); r.addEventListener("animationend",()=>r.remove()); });
})();
render();
if(location.hash) setTimeout(()=>go(location.hash),50);
</script>
